submission:
  title: "upply Chain Disruption Assistant & Fleet Utilisation Optimizer"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Supply chain disruptions — weather events, port strikes, geopolitical
    crises — cascade across hundreds of active shipments in ways that are
    impossible to track manually. Fleet assets sit idle while other routes
    are overloaded, and cold chain shipments (vaccines, perishables) are
    only found to have breached temperature limits at delivery, when it is
    too late to act.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    Our solution ingests active disruption feeds, vessel/route data, fleet
    telematics, and cold-chain IoT sensor logs to: (1) identify which
    shipments are impacted by an active disruption and rank them by risk,
    (2) recommend alternate carriers and idle fleet assets that can absorb
    the affected cargo immediately, (3) generate a redeployment plan
    matching idle trucks/vessels/reefer containers to disrupted regions,
    and (4) continuously scan cold-chain sensor logs to detect temperature
    excursions and classify their regulatory severity before delivery. An
    AI advisor layer (pluggable to IBM watsonx.ai) turns all four outputs
    into a single BLUF operations brief for a shift supervisor.
    
  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Disruption impact scoring: ranks affected shipments by severity, cargo value, and cold-chain risk"
    - "Re-routing engine: recommends alternate carriers and matches idle fleet assets to affected shipments"
    - "Fleet redeployment planner: matches idle trucks/vessels/reefer containers to disrupted regions"
    - "Cold-chain excursion detector: flags temperature breaches and classifies severity (Minor/Major/Critical) using GDP-inspired thresholds"
    - "AI-generated BLUF operations brief, pluggable to IBM watsonx.ai with a deterministic fallback so the demo never depends on a live API key"

  tech_stack:
- Frontend/App: Streamlit (Python)
- Logic/Backend: Python (pandas for data processing)
- AI Layer: IBM watsonx.ai (Granite instruct model) via REST API, with a rule-based BLUF generator as an offline fallback
- Built with: IBM Bob (see `docs/architecture.md` for how Bob was used in development)                         # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The cold-chain excursion detector and the fleet redeployment matcher run on the exact same underlying data model as the disruption-impact engine — meaning a single disruption event automatically triggers all four types of 
    recommendations without any manual hand-off between spreadsheets, which is exactly the workflow the problem statement describes as "impossible to track manually" today.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

